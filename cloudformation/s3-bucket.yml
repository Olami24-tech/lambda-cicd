AWSTemplateFormatVersion: '2010-09-09'
Description: 'S3 bucket for CICD PR'

Parameters:
  Environment:
    Type: String
    Default: test
    AllowedValues: 
      - test
      - staging
      - production

Resources:
  MyS3Bucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketNmae: !Sub '${AWS::Stackname}-${Environment}-bucket'
      Tags:
        - Key: Environmemt
          Value: !Ref Environmemt
        - Key:  Environmemt
          Value: GithubActionsTesting

Outputs:
  BucketName: 
    Description: 'Name of created S3 Bucket'
    Value: !Ref MyS3Bucket  